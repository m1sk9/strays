[package]
name = "strays"
version = "0.2.0"
edition = "2024"
description = "A TUI for Centralized Management of LLM Agents Running on Machines."
license = "MIT"
repository = "https://github.com/m1sk9/strays"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
# Released binaries are shipped as archives from GitHub Releases; debug symbols
# roughly double the download for something no user of a prebuilt build can act on.
strip = true
