id = "strays"
name = "strays"
version = "0.4.1"
description = "A TUI for Centralized Management of Claude Code, opened in its own herdr tab."
# The oldest server that `agent focus` and `agent_session` were verified against.
min_herdr_version = "0.9.1"
# No prebuilt Windows binary exists, and strays itself doesn't support Windows.
platforms = ["linux", "macos"]

[[build]]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[panes]]
id = "strays"
title = "strays"
placement = "tab"
command = ["/bin/sh", "scripts/run-strays.sh"]

[[actions]]
id = "open-strays"
title = "Open strays"
description = "Open the strays session dashboard in a new tab."
command = ["/bin/sh", "scripts/open-strays.sh"]
